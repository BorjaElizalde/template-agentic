# From the agentic template: change the template, not this copy.
# The options of the repository's tmux: Claude Code's keys work in its sessions' windows as in a
# plain terminal, and the status line shows the bar of the tasks. They load on top of the owner's
# ~/.tmux.conf.

# Shift+Enter: tmux passes on the extended keys a program asks for, from a terminal that sends them.
set -s extended-keys on
# An index of its own, so loading this file again replaces the entry instead of adding one.
set -s terminal-features[99] 'xterm*:extkeys'
# Esc: tmux before 3.5 waits 500 ms after an Esc for the rest of a key's sequence.
set -s escape-time 10

# The status line holds the bar alone. tmux shows the last line a command has printed, runs the
# command only while a terminal is attached, and starts it again at any redraw once it has ended.
# So the command never ends: the bar reads the tasks every 5 minutes, and refresh-client -S, which
# kills the command and starts it again, makes it read them at once.
set -g status-format[0] ' #(while :; do bash #{q:session_path}/.claude/skills/task/scripts/task.sh bar; sleep 300; done)'
