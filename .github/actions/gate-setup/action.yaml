# What this repository's make gate needs on the runner, which the Gate workflow's gate job installs
# before it runs make gate.
name: Gate setup
description: Install uv and tmux, which this repository's make gate runs.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
    # The task suite drives real tmux windows, and GitHub's Ubuntu runner has no tmux.
    - name: Install tmux
      shell: bash
      run: sudo apt-get update -q && sudo apt-get install -y -q tmux
