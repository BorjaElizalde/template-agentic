# This repository's own CI checks, which the Gate workflow of its template runs. A template
# repository's CI may run make gate: the rule that CI never runs it is for projects' CI.
name: Template checks
description: Renders the template and runs every rendered suite through make gate
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
    # The task suite drives real tmux windows, and GitHub's Ubuntu runner has no tmux.
    - run: sudo apt-get update -q && sudo apt-get install -y -q tmux
      shell: bash
    - run: make gate
      shell: bash
