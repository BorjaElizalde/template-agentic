# From the agentic template: change the template, not this copy.
# Rulesets can't limit a PR's source or size, so the staging and main rulesets require this check.
# Not every plan has rulesets to require an up-to-date branch, so a PR into probe/149-base that lacks
# probe/149-base's newest commits shows a failed up-to-date check here.
name: Probe 149

on:
  pull_request:
    branches: [probe/149-base]
    # A changed base arrives as edited; without it the PR keeps the verdict of its first base.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [probe/149-base]

jobs:
  branch-protection:
    # A commit's checks show on every PR it is the head of, so the probe/149-base rule reports under a name
    # of its own: as branch-protection, it would answer the check the staging and main rulesets
    # require. Tried a second job, but a skipped job reports as passed under its own name.
    name: >-
      ${{ github.event_name == 'pull_request' && github.base_ref != 'probe/149-base'
      && 'branch-protection' || 'up-to-date' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # A branch name can't hold a colon.
      - name: Check the PR's source and commits
        if: github.base_ref == 'staging' || github.base_ref == 'main'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          case "$BASE:$HEAD" in
            main:staging | staging:probe/149-base) ;;
            staging:bugfix/*)
              [ "$COMMITS" -eq 1 ] ||
                { echo "::error::A bugfix/ PR into staging holds one commit, not $COMMITS: amend it into one and push with --force-with-lease."; exit 1; } ;;
            *) echo "::error::No PR from $HEAD into $BASE: main takes staging, and staging takes probe/149-base or bugfix/*."; exit 1 ;;
          esac
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] ||
            { echo "::error::$BASE takes PRs from this repository's own branches, not from $HEAD_REPO."; exit 1; }
      - name: Fail a PR into probe/149-base that lacks probe/149-base's newest commits
        if: github.base_ref == 'probe/149-base'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/probe/149-base...$HEAD_SHA" --jq .behind_by)"
          [ "$behind" -eq 0 ] ||
            { echo "::error::This branch lacks probe/149-base's newest commits ($behind), so its checks say nothing about its code with probe/149-base as it is: merge probe/149-base into it."; exit 1; }
      # A run of the PR can't fail it here: nothing of the PR happens when probe/149-base moves, and a
      # re-run is offered for 30 days only. So the PR's head takes a failed status, which a new
      # head leaves behind.
      - name: Mark each open PR into probe/149-base that lacks the pushed commits
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heads="$(gh pr list --repo "$GITHUB_REPOSITORY" --base probe/149-base --limit 1000 --json headRefOid --jq '.[].headRefOid')"
          for head in $heads; do
            behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/probe/149-base...$head" --jq .behind_by)"
            [ "$behind" -eq 0 ] ||
              gh api "repos/$GITHUB_REPOSITORY/statuses/$head" --silent -f state=failure -f context=up-to-date \
                -f description="This branch lacks probe/149-base's newest commits: merge probe/149-base into it."
          done
