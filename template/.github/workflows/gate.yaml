# From the agentic template: change the template, not this copy.
# The develop and staging rulesets require this check.
name: Gate

on:
  pull_request:
    # No main: it takes staging alone (Branch flow), whose code passed this check on its way in.
    # Tried main with its job skipped, but nothing requires gate to report there.
    branches: [develop, staging]

concurrency:
  group: gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # A promotion's code passed this check on its way into develop, so a second run only costs
    # minutes. Tried the head's name alone, but a fork's develop would skip too. Tried a trigger
    # filter in place of the if, but it can't read a PR's head, and a required check that never
    # reports blocks the merge, where a skipped job passes.
    if: ${{ !(github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The stack layer's checks, each tool called directly. A project's CI never runs make gate,
      # so a change that relaxes the local gate can't relax CI.
      - uses: ./.github/actions/stack-gate
